<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Application - Learning App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
</head>
<body class="bg-white min-h-screen text-black">

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="w-full mx-auto px-4 sm:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="font-bold text-xl text-black">LearningApp</span>
                </div>
                <div class="flex items-center space-x-4 text-sm font-medium">
                    <a href="teacher-apply.html" class="text-black">Teacher Application</a>
                    <a href="#" onclick="handleLogout()" class="text-gray-500 hover:text-black">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="w-full px-4 sm:px-8 py-8 max-w-2xl">
        <h1 class="text-3xl font-bold text-black mb-6">Teacher Application</h1>
        <p id="error-msg" class="hidden border-2 border-black bg-gray-100 p-3 font-bold text-sm mb-4"></p>

        <section id="notifications" class="hidden border border-gray-200 rounded-lg p-6 mb-6"></section>

        <!-- Status, once an application exists -->
        <section id="status" class="hidden border border-gray-200 rounded-lg p-6 mb-6">
            <h2 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Application status</h2>
            <p id="status-text" class="text-xl font-bold text-black mb-2"></p>
            <p id="status-note" class="text-sm text-gray-600"></p>
            <dl id="status-details" class="text-sm mt-4 pt-4 border-t border-gray-200 grid grid-cols-1 sm:grid-cols-3 gap-x-4 gap-y-2"></dl>
        </section>

        <!-- Application form, before applying -->
        <form id="apply-form" onsubmit="submitApplication(event)" class="hidden border border-gray-200 rounded-lg p-6 space-y-4 text-sm">
            <p class="text-gray-600">Tell us about your teaching background. An administrator reviews every application. You can answer students' questions once it is accepted.</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <p class="font-medium mb-1">Full name</p>
                    <p id="acc-name" class="border border-gray-200 px-3 py-2 bg-gray-50 break-words"></p>
                </div>
                <div>
                    <p class="font-medium mb-1">Email</p>
                    <p id="acc-email" class="border border-gray-200 px-3 py-2 bg-gray-50 break-all"></p>
                </div>
            </div>
            <div>
                <label for="f-qualification" class="block font-medium mb-1">Highest qualification</label>
                <input id="f-qualification" type="text" maxlength="200" required class="border border-gray-300 px-3 py-2 w-full">
            </div>
            <div>
                <label for="f-institution" class="block font-medium mb-1">Institution</label>
                <input id="f-institution" type="text" maxlength="200" required class="border border-gray-300 px-3 py-2 w-full">
            </div>
            <div>
                <label for="f-experience" class="block font-medium mb-1">Teaching experience (years)</label>
                <input id="f-experience" type="number" min="0" max="70" step="1" required class="border border-gray-300 px-3 py-2 w-32">
            </div>
            <div>
                <label for="f-subjects" class="block font-medium mb-1">Subjects and topics you can teach</label>
                <textarea id="f-subjects" rows="2" maxlength="1000" required class="border border-gray-300 px-3 py-2 w-full"></textarea>
            </div>
            <div>
                <label for="f-skills" class="block font-medium mb-1">Relevant skills or certifications <span class="text-gray-500 font-normal">(optional)</span></label>
                <textarea id="f-skills" rows="2" maxlength="1000" class="border border-gray-300 px-3 py-2 w-full"></textarea>
            </div>
            <div>
                <label for="f-intro" class="block font-medium mb-1">Short teaching introduction</label>
                <textarea id="f-intro" rows="4" maxlength="2000" required class="border border-gray-300 px-3 py-2 w-full"></textarea>
            </div>
            <button id="apply-btn" class="bg-black text-white font-medium py-2 px-5 disabled:bg-gray-500">Submit application</button>
            <p id="apply-msg" class="hidden border-2 border-black bg-gray-100 p-2 font-bold"></p>
        </form>
    </main>

    <script>
        const NOTES = {
            pending: 'An administrator will review it. This page shows the decision as soon as it is made.',
            accepted: 'You are an approved teacher and can now answer students\' questions.',
            rejected: 'Your application was not accepted. You can still use LearnFlow as a student.'
        };

        function showStatus(a) {
            document.getElementById('apply-form').classList.add('hidden');
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('status-text').innerText = a.status[0].toUpperCase() + a.status.slice(1);
            document.getElementById('status-note').innerHTML = escapeHtml(NOTES[a.status]) +
                (a.status === 'accepted' ? ' <a href="teacher.html" class="underline">Open Teacher Corner</a>' :
                 a.status === 'rejected' ? ' <a href="dashboard.html" class="underline">Go to dashboard</a>' : '');
            const rows = [['Submitted', formatDate(a.created_at)], ['Qualification', a.qualification], ['Institution', a.institution],
                          ['Experience', `${a.experience_years} years`], ['Subjects and topics', a.subjects],
                          ['Skills', a.skills || '—'], ['Introduction', a.introduction]];
            document.getElementById('status-details').innerHTML = rows.map(([k, v]) =>
                `<dt class="text-gray-500">${k}</dt><dd class="sm:col-span-2 whitespace-pre-wrap break-words">${escapeHtml(v)}</dd>`).join('');
        }

        async function submitApplication(e) {
            e.preventDefault();
            const btn = document.getElementById('apply-btn'), msg = document.getElementById('apply-msg');
            btn.disabled = true; btn.innerText = 'Submitting...'; msg.classList.add('hidden');
            try {
                const data = await apiRequest('POST', '/api/teacher/application', {
                    qualification: document.getElementById('f-qualification').value,
                    institution: document.getElementById('f-institution').value,
                    experience_years: parseInt(document.getElementById('f-experience').value, 10),
                    subjects: document.getElementById('f-subjects').value,
                    skills: document.getElementById('f-skills').value,
                    introduction: document.getElementById('f-intro').value
                });
                showStatus(data.application);
            } catch (err) { msg.innerText = err.message; msg.classList.remove('hidden'); }
            btn.disabled = false; btn.innerText = 'Submit application';
        }

        async function init() {
            if (!requireAuth()) return;
            try {
                const data = await apiRequest('GET', '/api/teacher/application');
                if (data.application) showStatus(data.application);
                else {
                    document.getElementById('acc-name').innerText = data.account.full_name || '—';
                    document.getElementById('acc-email').innerText = data.account.email || '—';
                    document.getElementById('apply-form').classList.remove('hidden');
                }
                showNotifications('notifications');
            } catch (err) {
                const el = document.getElementById('error-msg');
                el.innerText = err.message; el.classList.remove('hidden');
            }
        }
        init();
    </script>
</body>
</html>
